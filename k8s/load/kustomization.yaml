apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pikalo
resources:
  - ../autoscaling
  - fixture-backend.yaml
patches:
  - target:
      kind: Deployment
      name: answer-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: pikalo-load:local
      - op: add
        path: /spec/template/spec/containers/0/command
        value: [node, --import, tsx, load/answer.mts]
