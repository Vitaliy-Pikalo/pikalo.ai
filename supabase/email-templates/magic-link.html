<!--
  Paste into Supabase → Authentication → Emails → Templates, for both
  "Magic link" and "Confirm signup" (new users get the confirm email).
  Subject: Your Pikalo sign-in link
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #14213d; line-height: 1.5">
  <p style="font-size: 18px; font-weight: 600; margin: 24px 0 8px">Sign in to Pikalo</p>
  <p style="margin: 0 0 20px">Click the button to sign in. The link works once and expires in an hour.</p>
  <p style="margin: 0 0 24px">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #14213d; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600">
      Sign in
    </a>
  </p>
  <p style="font-size: 13px; color: #5b6475; margin: 0 0 8px">
    Open it in the same browser where you asked for it. If you didn't request this, ignore this email.
  </p>
  <p style="font-size: 13px; color: #5b6475; margin: 0">
    Pikalo never asks for your SSN, ITIN or bank details. · <a href="https://pikalo.org/privacy" style="color: #5b6475">Privacy</a>
  </p>
</div>
